# remote-xterm host session
# Full default tmux key table is kept (prefix = C-b).
# Clients connect via webxdc xterm.js → PTY → this session.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"

# Standard prefix (Ctrl-b) — all default binds remain
# set -g prefix C-b

set -g mouse on
set -g history-limit 50000
set -g status on
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=colour235,fg=colour136"
set -g status-left "#[fg=green]#S #[fg=white]| "
set -g status-right "#[fg=cyan]remote-xterm #[fg=white]%H:%M "
setw -g window-status-current-style "fg=black,bg=colour136,bold"

# Responsive nested editors / faster Esc
set -s escape-time 10
set -g focus-events on
set -g aggressive-resize on

# Keep default key tables (no unbind -a)
# Common reminders (defaults):
#   C-b c     new window
#   C-b n/p   next/prev window
#   C-b %     split vertical
#   C-b "     split horizontal
#   C-b o     next pane
#   C-b x     kill pane
#   C-b d     detach
#   C-b [     copy mode
#   C-b ?     list keys
