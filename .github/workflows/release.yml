# Build TerminalBuddy once (webxdc + Rust), then:
#   - publish a versioned GitHub Release (main + tags + manual)
#   - package the same binary into a Debian 13 image and push to GHCR
#
# Docker does NOT recompile Rust — it only COPYs dist/terminalbuddy.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Force GHCR push (releases always publish)"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"
  CORE_REF: 823b0741df82e3ec0f61285d52bf91ae19b1963e
  REGISTRY: ghcr.io

jobs:
  linux-x86_64:
    name: Build binary + Docker (reuse binary)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout TerminalBuddy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: terminalbuddy
          fetch-depth: 0

      - name: Checkout chatmail/core (deltachat path dep)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: chatmail/core
          ref: ${{ env.CORE_REF }}
          path: terminalbuddy/context/deltachat-core-rust
          show-progress: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev perl zip curl ca-certificates

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: terminalbuddy/agent -> target
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminalbuddy/webxdc/package-lock.json

      - name: Build (webxdc + release binary with embed)
        working-directory: terminalbuddy
        run: make build

      - name: Name release asset + versions (app + core)
        id: ver
        working-directory: terminalbuddy
        run: |
          set -euo pipefail
          test -x dist/terminalbuddy
          cp -f dist/terminalbuddy "dist/terminalbuddy-linux-x86_64"
          ./dist/terminalbuddy --version
          ls -lah dist/

          # Project version from VERSION file (or git tag vX.Y.Z)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          TAG_NAME="v${VERSION}"

          # chatmail/core (deltachat) pin used for this build
          CORE_DIR="context/deltachat-core-rust"
          CORE_PKG="$(sed -n 's/^version = "\(.*\)"/\1/p' "${CORE_DIR}/Cargo.toml" | head -n1)"
          CORE_COMMIT="$(git -C "${CORE_DIR}" rev-parse HEAD)"
          CORE_SHORT="$(git -C "${CORE_DIR}" rev-parse --short HEAD)"
          CORE_BRANCH="$(git -C "${CORE_DIR}" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
          if [[ -z "${CORE_BRANCH}" || "${CORE_BRANCH}" == "HEAD" ]]; then
            CORE_BRANCH="${CORE_REF}"
          fi
          CORE_URL="https://github.com/chatmail/core/tree/${CORE_COMMIT}"

          IMAGE_BASE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          {
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "image=${IMAGE_BASE}"
            echo "core_pkg=${CORE_PKG}"
            echo "core_commit=${CORE_COMMIT}"
            echo "core_short=${CORE_SHORT}"
            echo "core_branch=${CORE_BRANCH}"
            echo "core_url=${CORE_URL}"
            echo "core_ref_requested=${CORE_REF}"
            echo "rust_version=${RUST_VERSION}"
            echo "git_sha=${GITHUB_SHA}"
            echo "git_sha_short=$(echo "${GITHUB_SHA}" | cut -c1-7)"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: ${TAG_NAME}"
          echo "Core: ${CORE_PKG} @ ${CORE_SHORT} (${CORE_BRANCH})"
          echo "Image: ${IMAGE_BASE}:${VERSION}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminalbuddy-linux-x86_64
          path: terminalbuddy/dist/terminalbuddy-linux-x86_64
          if-no-files-found: error

      # Always publish a versioned GitHub Release (main, tags, workflow_dispatch).
      # Previously this was skipped on main because of: if: startsWith(github.ref, 'refs/tags/v')
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: TerminalBuddy ${{ steps.ver.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: terminalbuddy/dist/terminalbuddy-linux-x86_64
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            ## TerminalBuddy `${{ steps.ver.outputs.tag_name }}`

            Single binary with the mini app **embedded** — no separate `.xdc` needed.

            | | |
            |---|---|
            | **TerminalBuddy version** | `${{ steps.ver.outputs.version }}` |
            | **Git commit** | `${{ steps.ver.outputs.git_sha_short }}` (`${{ steps.ver.outputs.git_sha }}`) |
            | **Rust toolchain** | `${{ steps.ver.outputs.rust_version }}` |
            | **chatmail/core (deltachat)** | **`${{ steps.ver.outputs.core_pkg }}`** @ `${{ steps.ver.outputs.core_short }}` |
            | **core branch/ref** | `${{ steps.ver.outputs.core_branch }}` (requested: `${{ steps.ver.outputs.core_ref_requested }}`) |
            | **core commit** | [`${{ steps.ver.outputs.core_commit }}`](${{ steps.ver.outputs.core_url }}) |
            | **Container image** | `ghcr.io/omidz4t/terminal-buddy-webxdc:${{ steps.ver.outputs.version }}` |

            ### Binary (Linux x86_64)

            ```bash
            wget -qO terminalbuddy https://github.com/omidz4t/terminal-buddy-webxdc/releases/latest/download/terminalbuddy-linux-x86_64 && chmod +x terminalbuddy && ./terminalbuddy serve
            ```

            ### Docker (GHCR, Debian 13 — same binary, no recompile)

            ```bash
            docker run --rm -it \
              -v terminalbuddy-data:/data \
              ghcr.io/omidz4t/terminal-buddy-webxdc:${{ steps.ver.outputs.version }} \
              serve --invite 'https://i.delta.chat/#…' --allowed-commands ls,cat,pwd,whoami
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Docker: package the already-built binary (no second Rust build) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ver.outputs.image }}"
          VERSION="${{ steps.ver.outputs.version }}"
          TAGS="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"
          {
            echo "list<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tags:"
          echo "${TAGS}"

      - name: Build & push image (COPY dist binary only — no cargo)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terminalbuddy
          file: terminalbuddy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=TerminalBuddy
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.revision=${{ steps.ver.outputs.git_sha }}
